# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci
      - name: Generate frontend bindings
        working-directory: apps/desktop
        run: go tool wails3 generate bindings -clean=true -ts
      - name: Verify frontend
        working-directory: apps/desktop/frontend
        run: |
          npm run check
          npm run build
          npm audit --audit-level=high
      - name: Verify Go formatting
        run: |
          files=$(git ls-files '*.go')
          unformatted=$(gofmt -l $files)
          test -z "$unformatted" || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        run: go test ./...
      - name: Test Anime1 adapter acceptance
        run: go test ./adapters/source/anime1 -run '^TestAnime1AdapterAcceptance'
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build desktop shell
        working-directory: apps/desktop
        run: go build -o bin/animeportable .
      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
