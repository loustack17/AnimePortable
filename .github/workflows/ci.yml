# SPDX-License-Identifier: MPL-2.0

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $($unformatted -join ', ')" }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        run: go test -count=1 ./...
      - name: Repeat desktop lifecycle and player checks
        run: go test -count=20 ./apps/desktop ./apps/desktop/backend ./apps/desktop/fltkhome ./adapters/player/libmpv
      - name: Test Anime1 adapter acceptance
        run: go test ./adapters/source/anime1 -run '^TestAnime1AdapterAcceptance'
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify desktop dependency closure
        shell: pwsh
        run: |
          $dependencies = @(go list -deps -tags production ./apps/desktop)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacy = @($dependencies | Where-Object { $_ -match 'fyne|wails|webview|go-mpv' })
          if ($legacy.Count -ne 0) { throw "Legacy desktop dependency: $($legacy -join ', ')" }
      - name: Build Windows desktop
        shell: pwsh
        run: |
          go build -tags production -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\animeportable.exe" ./apps/desktop
          exit $LASTEXITCODE
      - name: Smoke test Windows portable startup without libmpv
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'extracted-windows'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $executable = Join-Path $directory 'animeportable.exe'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'animeportable.exe') -Destination $executable
          $process = Start-Process -FilePath $executable -WorkingDirectory $directory -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw 'FLTK desktop exited without libmpv' }
            if ($process.Path -ne (Resolve-Path -LiteralPath $executable).Path) { throw 'Unexpected executable path' }
            if (-not (Test-Path -LiteralPath (Join-Path $directory 'data\animeportable.db'))) { throw 'Portable database missing' }
          } finally {
            if (-not $process.HasExited) {
              $process.CloseMainWindow() | Out-Null
              if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
            }
            $process.Dispose()
          }
      - name: Verify clean worktree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) { throw "CI modified the worktree: $($changes -join ', ')" }
