# SPDX-License-Identifier: MPL-2.0

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.9
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          # go-fltk's prebuilt FLTK libraries are built for msvcrt, so the runner's UCRT MinGW cannot link them.
          # No full system upgrade: install only gcc, reused from the action's package cache when possible.
          msystem: MINGW64
          update: false
          cache: true
          install: mingw-w64-x86_64-gcc
      - name: Select C toolchain
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_ROOT 'mingw64\bin'
          $gcc = Join-Path $bin 'gcc.exe'
          $gxx = Join-Path $bin 'g++.exe'
          if (-not (Test-Path -LiteralPath $gcc) -or -not (Test-Path -LiteralPath $gxx)) { throw 'MSVCRT C toolchain missing' }
          $target = & $gcc -dumpmachine
          if ($target -ne 'x86_64-w64-mingw32') { throw "Unexpected C toolchain target: $target" }
          & $gcc --version
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CC=$gcc"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CXX=$gxx"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANIMEPORTABLE_OBJDUMP=$(Join-Path $bin 'objdump.exe')"
          $goVerifierTemp = Join-Path $env:RUNNER_TEMP 'go-native-verifier'
          New-Item -ItemType Directory -Force -Path $goVerifierTemp | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GOTMPDIR=$goVerifierTemp"
      - name: Restore pinned Mesa
        id: mesa-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/mesa
          key: mesa-dist-win-26.2.4-release-mingw-x64
      - name: Download pinned Mesa
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Software OpenGL (llvmpipe) for native tests on GPU-less runners; test-only, never shipped.
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-mingw.7z'
          & curl.exe --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 300 --max-filesize 67108864 --output $archive 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-mingw.7z'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '36A30A04D8CAB6E2BEA2D3C747C326D15024D9711DD80F45EF97AC6F2C3C5086') { throw 'Mesa archive hash mismatch' }
          & 7z x $archive "-o$(Join-Path $env:RUNNER_TEMP 'mesa')" 'x64\*' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select pinned Mesa
        shell: pwsh
        run: |
          $mesaBin = Join-Path $env:RUNNER_TEMP 'mesa\x64'
          foreach ($name in @('opengl32.dll', 'libgallium_wgl.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $mesaBin $name) -PathType Leaf)) { throw "Mesa test dependency missing: $name" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANIMEPORTABLE_TEST_MESA_BIN=$mesaBin"
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $($unformatted -join ', ')" }
      - name: Verify Go module
        run: go mod verify
      - name: Repeat desktop lifecycle and player checks
        run: go test -count=20 ./apps/desktop ./apps/desktop/backend ./apps/desktop/fltkhome ./adapters/player/libmpv
      - name: Test Anime1 adapter acceptance
        run: go test ./adapters/source/anime1 -run '^TestAnime1AdapterAcceptance'
      - name: Test Go with race detector
        shell: pwsh
        run: |
          $launcher = 'pwsh -NoProfile -File "' + (Join-Path $env:GITHUB_WORKSPACE 'tools\windows-mesa-test-exec.ps1') + '"'
          go test -exec $launcher -race -count=1 ./...
          exit $LASTEXITCODE
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify desktop dependency closure
        shell: pwsh
        run: |
          $dependencies = @(go list -deps ./apps/desktop)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacy = @($dependencies | Where-Object { $_ -match 'fyne|wails|webview|go-mpv' })
          if ($legacy.Count -ne 0) { throw "Legacy desktop dependency: $($legacy -join ', ')" }
      - name: Build Windows desktop
        shell: pwsh
        run: |
          go build -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\animeportable.exe" ./apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = & $env:ANIMEPORTABLE_OBJDUMP -p (Join-Path $env:RUNNER_TEMP 'animeportable.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dllNames = @($imports | Select-String 'DLL Name:' | ForEach-Object { $_.Line.Trim() })
          $dllNames
          if ($dllNames -match 'gallium|LLVM|mesa') { throw 'Verifier dependency entered the product executable' }
      - name: Smoke test Windows portable startup without libmpv
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'extracted-windows'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $executable = Join-Path $directory 'animeportable.exe'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'animeportable.exe') -Destination $executable
          $process = Start-Process -FilePath $executable -WorkingDirectory $directory -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw 'FLTK desktop exited without libmpv' }
            if ($process.Path -ne (Resolve-Path -LiteralPath $executable).Path) { throw 'Unexpected executable path' }
            if (-not (Test-Path -LiteralPath (Join-Path $directory 'data\animeportable.db'))) { throw 'Portable database missing' }
          } finally {
            if (-not $process.HasExited) {
              $process.CloseMainWindow() | Out-Null
              if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
            }
            $process.Dispose()
          }
      - name: Verify clean worktree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) { throw "CI modified the worktree: $($changes -join ', ')" }
      - name: Preserve Windows acceptance executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/animeportable.exe
          if-no-files-found: error
          retention-days: 7
