name: CI

on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Verify frontend
        working-directory: apps/desktop/frontend
        run: |
          npm ci
          npm run check
          npm run build
          npm audit --audit-level=high
      - name: Verify Go formatting
        run: |
          files=$(git ls-files '*.go')
          unformatted=$(gofmt -l $files)
          test -z "$unformatted" || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        run: go test ./...
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate frontend bindings
        working-directory: apps/desktop
        run: wails3 generate bindings -clean=true -ts
      - name: Build desktop shell
        working-directory: apps/desktop
        run: go build -o bin/animeportable .
