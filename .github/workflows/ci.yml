# SPDX-License-Identifier: MPL-2.0

name: CI

permissions:
  contents: read

on:
  # Documentation alone needs no build or test. Path filters do not apply to tag pushes.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # A release tag reuses the executable tested when its commit reached main (release job).
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          # go-fltk's prebuilt FLTK libraries are built for msvcrt, so the runner's UCRT MinGW cannot link them.
          # No full system upgrade: install only gcc, reused from the action's package cache when possible.
          msystem: MINGW64
          update: false
          cache: true
          install: mingw-w64-x86_64-gcc
      - name: Select C toolchain
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_ROOT 'mingw64\bin'
          $gcc = Join-Path $bin 'gcc.exe'
          $gxx = Join-Path $bin 'g++.exe'
          if (-not (Test-Path -LiteralPath $gcc) -or -not (Test-Path -LiteralPath $gxx)) { throw 'MSVCRT C toolchain missing' }
          $target = & $gcc -dumpmachine
          if ($target -ne 'x86_64-w64-mingw32') { throw "Unexpected C toolchain target: $target" }
          & $gcc --version
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CC=$gcc"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CXX=$gxx"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANIMEPORTABLE_OBJDUMP=$(Join-Path $bin 'objdump.exe')"
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $($unformatted -join ', ')" }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        shell: pwsh
        run: |
          # The window (FLTK) and real-libmpv packages run in the local native suite before a push
          # (AGENTS.md); CI runs everything that needs neither, once.
          $packages = @(go list ./... | Where-Object { $_ -notmatch '/apps/desktop/(fltkhome|fltkplayer|fltkengine)' })
          go test -count=1 $packages
          exit $LASTEXITCODE
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify desktop dependency closure
        shell: pwsh
        run: |
          $dependencies = @(go list -deps ./apps/desktop)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacy = @($dependencies | Where-Object { $_ -match 'fyne|wails|webview|go-mpv' })
          if ($legacy.Count -ne 0) { throw "Legacy desktop dependency: $($legacy -join ', ')" }
      - name: Build Windows desktop
        shell: pwsh
        run: |
          # A Windows GUI program, so no console window opens next to the app (owner, 2026-10-22).
          go build -trimpath -buildvcs=false -ldflags "-H windowsgui" -o "$env:RUNNER_TEMP\animeportable.exe" ./apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = & $env:ANIMEPORTABLE_OBJDUMP -p (Join-Path $env:RUNNER_TEMP 'animeportable.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($imports -match '^Subsystem\s+0+2\s')) { throw 'The executable is not a Windows GUI program' }
          $dllNames = @($imports | Select-String 'DLL Name:' | ForEach-Object { $_.Line.Trim() })
          $dllNames
          if ($dllNames -match 'gallium|LLVM|mesa') { throw 'Verifier dependency entered the product executable' }
      - name: Smoke test Windows portable startup without libmpv
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'extracted-windows'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $executable = Join-Path $directory 'animeportable.exe'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'animeportable.exe') -Destination $executable
          $process = Start-Process -FilePath $executable -WorkingDirectory $directory -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw 'FLTK desktop exited without libmpv' }
            if ($process.Path -ne (Resolve-Path -LiteralPath $executable).Path) { throw 'Unexpected executable path' }
            if (-not (Test-Path -LiteralPath (Join-Path $directory 'data\animeportable.db'))) { throw 'Portable database missing' }
          } finally {
            if (-not $process.HasExited) {
              $process.CloseMainWindow() | Out-Null
              if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
            }
            $process.Dispose()
          }
      - name: Verify clean worktree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) { throw "CI modified the worktree: $($changes -join ', ')" }
      - name: Preserve Windows acceptance executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-desktop-${{ github.sha }}
          path: ${{ runner.temp }}/animeportable.exe
          if-no-files-found: error
          retention-days: 7
  release:
    # Publishes a pre-release ZIP for v* tags from the executable built and tested when the tagged
    # commit was pushed to main, so nothing is built or tested twice and only a tested build ships.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: Download tested executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The successful CI run of this commit on main; without one there is no tested build to ship.
          $runs = @(gh run list --workflow CI --branch main --event push --commit $env:GITHUB_SHA --status success --limit 1 --json databaseId | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($runs.Count -eq 0) { throw "No successful CI run on main for $env:GITHUB_SHA; push the commit to main and wait for CI before tagging." }
          gh run download $runs[0].databaseId --name "windows-desktop-$env:GITHUB_SHA" --dir (Join-Path $env:RUNNER_TEMP 'release-bin')
          if ($LASTEXITCODE -ne 0) { throw "The tested executable of CI run $($runs[0].databaseId) is missing (kept 7 days); push a new commit to main and tag that." }
      - name: Download pinned libmpv
        shell: pwsh
        run: |
          # The upstream release named in docs/LIBMPV_RUNTIME_NOTICE.txt; the DLL hash is checked again when packaging.
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev-x86_64-20260811-git-ad59ff1.7z'
          & curl.exe --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 300 --max-filesize 67108864 --output $archive 'https://github.com/Predidit/libmpv-win32-video-cmake/releases/download/20260811/mpv-dev-x86_64-20260811-git-ad59ff1.7z'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '0161AD026F9EBD418A9B660C8E8C569F7959B5BB8E5F4A63E462FFC73327D4D8') { throw 'libmpv archive hash mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'libmpv'
          & 7z e $archive "-o$directory" 'libmpv-2.dll' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANIMEPORTABLE_LIBMPV_DLL=$(Join-Path $directory 'libmpv-2.dll')"
      - name: Package portable ZIP
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $pin = (Select-String -LiteralPath ../../internal/runtimepin/libmpv.go -Pattern '"([0-9a-f]{64})"').Matches[0].Groups[1].Value
          $env:ANIMEPORTABLE_LIBMPV_SHA256 = $pin
          $zip = Join-Path $env:RUNNER_TEMP "AnimePortable-$env:GITHUB_REF_NAME-windows-amd64.zip"
          & ./build/windows/package.ps1 -Arch amd64 -Binary (Join-Path $env:RUNNER_TEMP 'release-bin\animeportable.exe') -Output $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_ZIP=$zip"
      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes missing: $notes" }
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ZIP --prerelease --verify-tag --title $env:GITHUB_REF_NAME --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
