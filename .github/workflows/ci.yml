# SPDX-License-Identifier: MPL-2.0

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  libmpv-build-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download fixed source archives
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/libmpv-source-trial"
          mkdir -p "$work/mpv" "$work/ffmpeg"
          curl --fail --location --retry 2 --output "$work/mpv.tar.gz" https://codeload.github.com/mpv-player/mpv/tar.gz/a1bf4b6559d6e644b967c22d87232dc77c7dd442
          curl --fail --location --retry 2 --output "$work/ffmpeg.tar.gz" https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/b227d1e4be9371e37da8107f7a30364fa8cff5fb
          printf '%s  %s\n' 61901f483f30ee9ff0fc202ac3761629a365bf91463a0bc233a6ecbbb04135fe "$work/mpv.tar.gz" 3ecf2663b37e7979d7e7d6da9a45d25aca2281fc18206224b452d11293a9aea7 "$work/ffmpeg.tar.gz" | sha256sum --check
          tar -xzf "$work/mpv.tar.gz" --directory "$work/mpv" --strip-components=1
          tar -xzf "$work/ffmpeg.tar.gz" --directory "$work/ffmpeg" --strip-components=1
      - name: Probe archive-only LGPL libmpv build
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/libmpv-source-trial"
          image=ghcr.io/btbn/ffmpeg-builds/win64-lgpl@sha256:ff679f7298f4a927ea8705c7523e61919d0eb6b632a5db18b36d29ed1158f89e
          printf '%s\n' "$image" > "$work/build-image.txt"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/project:ro" \
            --volume "$work:/work" \
            --workdir /work \
            "$image" bash /project/tools/libmpv-build/build.sh
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-build-probe
          path: |
            ${{ runner.temp }}/libmpv-source-trial/build-image.txt
            ${{ runner.temp }}/libmpv-source-trial/mpv.tar.gz
            ${{ runner.temp }}/libmpv-source-trial/ffmpeg.tar.gz
            ${{ runner.temp }}/libmpv-source-trial/evidence/
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: msys2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Select MSVCRT C toolchain
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $gcc = Join-Path $env:MSYS2_ROOT 'mingw64\bin\gcc.exe'
          $gxx = Join-Path $env:MSYS2_ROOT 'mingw64\bin\g++.exe'
          if (-not (Test-Path -LiteralPath $gcc) -or -not (Test-Path -LiteralPath $gxx)) { throw 'MSVCRT C toolchain missing' }
          & $gcc -dumpmachine
          & $gcc -v
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CC=$gcc"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CXX=$gxx"
      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $files)
          if ($unformatted.Count -ne 0) { throw "Unformatted Go files: $($unformatted -join ', ')" }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        run: go test -count=1 ./...
      - name: Repeat desktop lifecycle and player checks
        run: go test -count=20 ./apps/desktop ./apps/desktop/backend ./apps/desktop/fltkhome ./adapters/player/libmpv
      - name: Test Anime1 adapter acceptance
        run: go test ./adapters/source/anime1 -run '^TestAnime1AdapterAcceptance'
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify desktop dependency closure
        shell: pwsh
        run: |
          $dependencies = @(go list -deps -tags production ./apps/desktop)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $legacy = @($dependencies | Where-Object { $_ -match 'fyne|wails|webview|go-mpv' })
          if ($legacy.Count -ne 0) { throw "Legacy desktop dependency: $($legacy -join ', ')" }
      - name: Build Windows desktop
        shell: pwsh
        run: |
          go build -tags production -trimpath -buildvcs=false -o "$env:RUNNER_TEMP\animeportable.exe" ./apps/desktop
          exit $LASTEXITCODE
      - name: Smoke test Windows portable startup without libmpv
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'extracted-windows'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $executable = Join-Path $directory 'animeportable.exe'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'animeportable.exe') -Destination $executable
          $process = Start-Process -FilePath $executable -WorkingDirectory $directory -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw 'FLTK desktop exited without libmpv' }
            if ($process.Path -ne (Resolve-Path -LiteralPath $executable).Path) { throw 'Unexpected executable path' }
            if (-not (Test-Path -LiteralPath (Join-Path $directory 'data\animeportable.db'))) { throw 'Portable database missing' }
          } finally {
            if (-not $process.HasExited) {
              $process.CloseMainWindow() | Out-Null
              if (-not $process.WaitForExit(10000)) { Stop-Process -Id $process.Id -Force }
            }
            $process.Dispose()
          }
      - name: Verify clean worktree
        shell: pwsh
        run: |
          $changes = @(git status --porcelain)
          if ($changes.Count -ne 0) { throw "CI modified the worktree: $($changes -join ', ')" }
