# SPDX-License-Identifier: MPL-2.0

name: CI

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci
      - name: Verify frontend
        working-directory: apps/desktop/frontend
        run: |
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Install Chromium for Home verification
        working-directory: apps/desktop/frontend
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify Home browser interactions
        working-directory: apps/desktop/frontend
        timeout-minutes: 5
        run: node tests/browser/home.mjs
      - name: Verify Home controller for 20 rounds
        working-directory: apps/desktop/frontend
        timeout-minutes: 5
        run: |
          for cycle in {1..20}; do
            echo "Home controller round ${cycle}/20"
            node --test --test-name-pattern='controller' tests/home.test.mjs || exit 1
          done
      - name: Verify Go formatting
        run: |
          files=$(git ls-files '*.go')
          unformatted=$(gofmt -l $files)
          test -z "$unformatted" || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }
      - name: Verify Go module
        run: go mod verify
      - name: Test Go
        run: go test ./...
      - name: Test Anime1 adapter acceptance
        run: go test ./adapters/source/anime1 -run '^TestAnime1AdapterAcceptance'
      - name: Test Go with race detector
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Build desktop shell
        working-directory: apps/desktop
        run: go build -o bin/animeportable .
      - name: Verify clean worktree
        run: test -z "$(git status --porcelain)"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Install pinned external MPV test executable
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-v0.41.0.zip'
          $uri = 'https://github.com/mpv-player/mpv/releases/download/v0.41.0/mpv-v0.41.0-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '4e197f729f5071c6772f35fffd96e0f36e3e8a044bd9479b136bb09b7c6a80ff'
          if ($actual -ne $expected) { throw 'MPV download hash mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'external-mpv'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $executables = @(Get-ChildItem -LiteralPath $directory -Recurse -File -Filter mpv.exe)
          if ($executables.Count -ne 1) { throw 'Expected one MPV executable' }
          $process = Start-Process -FilePath $executables[0].FullName -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'MPV executable failed to start' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $executables[0].DirectoryName
      - name: Verify native desktop and service
        shell: pwsh
        run: |
          go test -count=1 ./apps/desktop/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags production -o "$env:RUNNER_TEMP\animeportable.exe" ./apps/desktop
          exit $LASTEXITCODE
      - name: Verify live Windows MPV IPC and playback
        shell: pwsh
        env:
          ANIMEPORTABLE_MPV_LIVE: '1'
        run: go test -count=1 -run '^(TestLiveIPC|TestLiveMPVLoadsThreeMediaURLsOnOneProcess)$' -timeout 90s ./adapters/player/mpv
