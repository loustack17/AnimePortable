version: '3'

tasks:
  build:
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -buildvcs=false -o {{.BIN_DIR}}/animeportable .
    env:
      GOOS: darwin
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '12.0'

  package:
    deps:
      - task: build
    cmds:
      - go run ../../tools/portable-package --os darwin --arch {{.TARGET_ARCH}} --binary {{.BIN_DIR}}/animeportable --output {{.BIN_DIR}}/animeportable-darwin-{{.TARGET_ARCH}}.zip --license ../../LICENSE --notices ../../THIRD_PARTY_NOTICES.md --icon build/darwin/icons.icns --plist build/darwin/Info.plist

  run:
    cmds:
      - '{{.BIN_DIR}}/animeportable'
