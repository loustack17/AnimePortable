version: '3'

tasks:
  build:
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -buildvcs=false -o {{.BIN_DIR}}/animeportable .
    env:
      GOOS: linux
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  package:
    deps:
      - task: build
    cmds:
      - go run ../../tools/portable-package --os linux --arch {{.TARGET_ARCH}} --binary {{.BIN_DIR}}/animeportable --output {{.BIN_DIR}}/animeportable-linux-{{.TARGET_ARCH}}.tar.gz --license ../../LICENSE --notices ../../THIRD_PARTY_NOTICES.md

  run:
    cmds:
      - '{{.BIN_DIR}}/animeportable'
