version: '3'

tasks:
  build:
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path bin | Out-Null"
      - go build -tags production -trimpath -buildvcs=false -o {{.BIN_DIR}}/animeportable.exe .
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '1'

  package:
    deps:
      - task: build
    cmds:
      - go run ../../tools/portable-package --os windows --arch {{.TARGET_ARCH}} --binary {{.BIN_DIR}}/animeportable.exe --output {{.BIN_DIR}}/animeportable-windows-{{.TARGET_ARCH}}.zip --license ../../LICENSE --notices ../../THIRD_PARTY_NOTICES.md

  run:
    cmds:
      - '{{.BIN_DIR}}/animeportable.exe'
